<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Terminal: Yaggo Querino, desenvolvedor full-stack, aceitando projetos freelance" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,"Liberation Mono",monospace}
    .p{fill:#9BD8A8} .ink{fill:#DCE3EB} .dim{fill:#5D6B7B} .acc{fill:#7CC8F8} .str{fill:#F2C27B} .kw{fill:#F28FB0}
    .l{opacity:0;animation:show .01s linear forwards}
    .l1{animation-delay:.3s}.l2{animation-delay:.9s}.l3{animation-delay:1.6s}.l4{animation-delay:2.2s}.l5{animation-delay:2.9s}.l6{animation-delay:3.5s}.l7{animation-delay:4.1s}
    @keyframes show{to{opacity:1}}
    .cur{animation:blink 1s steps(1) infinite 4.1s;opacity:0}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}.cur{animation:none;opacity:1}}
  </style>
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="#0B0F14"/>
