    <text x="48" y="182" class="l l3"><tspan class="p">$</tspan><tspan class="ink"> cat stack.txt</tspan></text>
    <text x="48" y="214" class="l l4"><tspan class="str">React · TypeScript · .NET/C# · Node.js · Python · PostgreSQL · Docker · Electron</tspan></text>
